name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci
        working-directory: server
      - name: Typecheck
        run: npm run typecheck
        working-directory: server
      - name: Lint
        run: npm run lint
        working-directory: server
      - name: Test (PGlite + real WS)
        run: npm test
        working-directory: server
      - name: Build
        run: npm run build
        working-directory: server

  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
        working-directory: client
      - name: Lint
        run: npm run lint
        working-directory: client
      - name: Build frontend (tsc + vite)
        run: npm run build
        working-directory: client

  rust:
    name: Tauri shell (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: client
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo check
        working-directory: client/src-tauri
        run: cargo check

  docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f docker/server.Dockerfile -t gametalk-server:ci .
