services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgres://gametalk:${POSTGRES_PASSWORD}@postgres:5432/gametalk
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      # 默认 *（桌面客户端不受浏览器同源限制，够用）；如需收紧在 .env 里设置 CORS_ORIGIN
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"   # 仅本机，由 Caddy 反代对外
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gametalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gametalk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametalk -d gametalk"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GAMETALK_HOST: ${GAMETALK_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
